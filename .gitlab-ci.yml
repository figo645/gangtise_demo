image: python:3.12   # 建议固定版本，不要用 latest（latest 现在已经是 3.14 了）

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip
    - venv/

before_script:
  - python --version
  - pip --version
  - python -m venv venv
  - source venv/bin/activate
  - pip install --upgrade pip

# 测试 job（如果你有 tests 目录的话）
test:
  stage: test
  script:
    - pip install -r requirements.txt   # 如果有 requirements.txt 的话
    # 或者直接安装依赖，例如：
    # - pip install flask sqlalchemy ... （按你实际依赖写）
    - python -m pytest tests/ -v --tb=short   # 如果你用 pytest
  # 如果暂时没有测试，可以先注释掉整个 test job

# 运行 / 检查能否启动
run:
  stage: test
  script:
    - pip install -r requirements.txt   # 同上
    - python -c "import app; print('app import success')"   # 简单检查能不能导入
    # 或者更完整一点：
    # - timeout 10s python3 app.py || true   # 尝试启动几秒，防止一直挂着

# 部署 job（示例，按你实际部署方式改）
deploy:
  stage: deploy
  script:
    - echo "这里写你的部署脚本"
    # 例如：
    # - scp -r . user@server:/path/to/app
    # - ssh user@server "cd /path/to/app && ./stop_app.sh && ./start_app.sh"
  environment:
    name: production
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH